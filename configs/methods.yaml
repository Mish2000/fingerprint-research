version: 1
schema_version: v2_method_registry
capture_labels:
  schema_version: v1_capture_labels
  canonical_values:
  - plain
  - roll
  - contactless
  - contact_based
  gate_mapping_for_masked_models:
    plain: plain
    contactless: plain
    roll: roll
    contact_based: roll
namespaces:
  api_runtime:
  - classic_orb
  - classic_gftt_orb
  - minutiae
  - harris
  - sift
  - sift_plain_roll_v2
  - dl
  - dedicated
  - vit
  benchmark_runtime:
  - classic_v2
  - minutiae
  - harris
  - sift
  - sift_plain_roll_v2
  - dl_quick
  - dedicated
  - vit
  - fusion_balanced_v1
identification:
  shortlist_retrieval_methods:
  - classic_orb
  - classic_gftt_orb
  - minutiae
  - harris
  - sift
  - dl
  - vit
  rerank_methods:
  - classic_orb
  - classic_gftt_orb
  - minutiae
  - harris
  - sift
  - sift_plain_roll_v2
  - dedicated
  - dl
  - vit
  vector_storage_schema:
    mode: method_generic_pgvector_table_with_legacy_compat
    method_generic_vectors_supported: true
    distance_metric: cosine
    indexed_dimensions_available:
    - 512
    - 768
    compatibility_note: >-
      Current production storage dual-writes registry-declared retrieval vectors
      to legacy feature_vectors columns and method-generic method_retrieval_vectors
      rows keyed by method, vector_kind, dim, and distance_metric. Legacy columns
      remain a compatibility fallback during migration.
  notes:
  - The secure split identification store currently persists pgvector-backed shortlist
    columns only for methods that declare supports_direct_vector_retrieval=true.
  - classic_orb, classic_gftt_orb, harris, and sift use deterministic aggregated
    descriptor vectors for fast 1:N shortlisting; minutiae uses a deterministic
    aggregate minutiae vector for shortlist only. Pairwise geometric or minutiae
    alignment rerank remains the authoritative final scoring step.
  - dedicated remains a valid experimental research rerank method for 1:N
    identification, but it is intentionally excluded from direct vector retrieval
    until a global retrieval vector adapter is scientifically validated.
methods:
  classic_orb:
    api_name: classic_orb
    accepted_aliases:
    - classic
    benchmark_name: classic_orb
    ui_label: Classic (ORB)
    family: local_features
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 512
      retrieval_vector_kind: classic_orb_aggregated_descriptor_v1
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: false
    canonical_default: false
    research_track: false
    promotion_required: false
    current_sources:
    - src/fpbench/matchers/matching_baseline.py
    - apps/api/service.py
    - pipelines/benchmark/evaluate.py
    planned_location: src/fpbench/matchers/matching_baseline.py
    scoring:
      output_score: inliers_over_min_keypoints
      decision_threshold_ref: decision.api.classic_orb
    api_runtime_defaults:
      detector: orb
      nfeatures: 1500
      ratio: 0.75
      reproj_threshold: 3.0
      scaleFactor: 1.2
      nlevels: 8
      edgeThreshold: 31
      fastThreshold: 10
    benchmark_defaults:
      detector: orb
      preprocess: runtime_square_512_clahe_blur
      geometry_model: homography
      score_mode: inliers_over_min_keypoints
      nfeatures: 1500
      ratio: 0.75
      ransac_thresh: 3.0
    notes:
    - The API path calls ORB extraction from src/fpbench/matchers/matching_baseline.py
      via apps/api/service.py.
    - >-
      This is the shipped runtime classic branch: square-preprocessed ORB features,
      homography geometry, and score normalization by the smaller detected keypoint count.
    - It is kept distinct from the ROI GFTT+ORB benchmark family and is not represented
      by the historical classic_v2 benchmark artifacts.
  classic_gftt_orb:
    api_name: classic_gftt_orb
    accepted_aliases:
    - classic_v2
    benchmark_name: classic_v2
    ui_label: Classic (ROI GFTT+ORB)
    family: local_features
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 512
      retrieval_vector_kind: classic_gftt_orb_aggregated_descriptor_v1
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: true
    canonical_default: true
    research_track: false
    promotion_required: false
    current_sources:
    - pipelines/benchmark/eval_classic.py
    - apps/api/service.py
    - pipelines/benchmark/evaluate.py
    planned_location: pipelines/benchmark/eval_classic.py
    scoring:
      output_score: inliers_over_k
      decision_threshold_ref: decision.api.classic_gftt_orb
    api_runtime_defaults:
      detector: gftt_orb
      nfeatures: 1500
      long_edge: 512
      ratio: 0.75
      ransac_thresh: 4.0
      score_mode: inliers_over_k
      roi_mode: benchmark_texture_roi
      geometry_model: affine_partial_2d
      clahe_clip: 2.0
      clahe_grid:
      - 8
      - 8
    benchmark_defaults:
      detector: gftt_orb
      score_mode: inliers_over_k
      nfeatures: 1500
      long_edge: 512
      ratio: 0.75
      ransac_thresh: 4.0
      roi_mode: benchmark_texture_roi
      geometry_model: affine_partial_2d
    notes:
    - >-
      This matches the benchmark classic_v2 family: ROI-masked preprocessing, GFTT keypoints
      with ORB descriptors, affine-partial RANSAC geometry, and score normalization by configured nfeatures.
    - Historical benchmark artifacts remain named classic_v2 on disk, but public presentation
      canonicalizes them to classic_gftt_orb.
  minutiae:
    api_name: minutiae
    benchmark_name: minutiae
    ui_label: Classic (Minutiae)
    family: minutiae
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 512
      retrieval_vector_kind: minutiae_aggregate_v1
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: true
    canonical_default: true
    research_track: false
    promotion_required: false
    current_sources:
    - src/fpbench/matchers/minutiae_matcher.py
    - apps/api/service.py
    - pipelines/benchmark/eval_minutiae.py
    - pipelines/benchmark/evaluate.py
    planned_location: src/fpbench/matchers/minutiae_matcher.py
    scoring:
      output_score: quality_penalized_matched_minutiae_over_min_template_count_floor
      decision_threshold_ref: decision.api.minutiae
    api_runtime_defaults:
      target_size: 512
      clahe_clip: 2.0
      clahe_grid:
      - 8
      - 8
      blur_ksize: 3
      preprocess: true
      ridge_kernel_size: 15
      min_ridge_response: 5.0
      min_binary_component_area: 12
      min_skeleton_component_area: 8
      border_px: 16
      suppress_top_ratio: 0.03
      roi_border_px: 10
      min_distance: 8.0
      orientation_radius: 9
      max_minutiae: 96
      max_thinning_iterations: 80
      candidate_quality_floor: 0.20
      dense_bifurcation_radius: 5
      max_dense_bifurcation_density: 0.24
      bifurcation_suppression_scale: 1.35
      spatial_tolerance: 14.0
      angle_tolerance_deg: 30.0
      anchor_limit: 28
      min_required_minutiae: 12
      allow_kind_mismatch: false
      kind_mismatch_weight: 0.65
      orientation_periodic_pi: true
      max_tentative_return: 256
    benchmark_defaults:
      preprocess: runtime_square_512_clahe_blur
      extraction: polarity_validated_ridge_enhancement_otsu_skeleton_crossing_number
      skeletonization: zhang_suen_numpy
      crossing_number:
        ridge_ending: 1
        bifurcation: 3
      alignment: anchor_orientation_rotation_translation
      score_mode: quality_penalized_matched_minutiae_over_min_template_count_floor
      retrieval_vector_kind: minutiae_aggregate_v1
      retrieval_vector_usage: shortlist_only
      target_size: 512
      max_minutiae: 96
      candidate_quality_floor: 0.20
      dense_bifurcation_radius: 5
      max_dense_bifurcation_density: 0.24
      bifurcation_suppression_scale: 1.35
      spatial_tolerance: 14.0
      angle_tolerance_deg: 30.0
      min_required_minutiae: 12
      method_semantics_epoch: minutiae_crossing_number_aligned_v2
    notes:
    - >-
      Classical crossing-number minutiae baseline: grayscale preprocessing, ROI gating,
      polarity-validated ridge enhancement, Otsu binarization, deterministic Zhang-Suen
      skeletonization, crossing-number endings/bifurcations, ROI-border suppression,
      dense-junction artifact rejection, and deterministic min-distance pruning.
    - >-
      Pairwise scoring is the authoritative verification/rerank score. It aligns
      minutiae templates by candidate anchor correspondences, estimates rotation and
      translation from minutia orientation and position, counts one-to-one matched
      minutiae within spatial and angular tolerances, and applies deterministic
      penalties for saturated or implausible extraction profiles and ambiguous
      tentative-to-matched ratios.
    - >-
      The 512D minutiae_aggregate_v1 vector encodes aggregate minutiae statistics for
      direct 1:N shortlist retrieval only; it is not the final match score.
    - >-
      decision.api.minutiae is an initial conservative API threshold, not a calibrated
      FAR/FRR/EER operating point. Calibrate on real benchmark artifacts before making
      accuracy or deployment claims.
    - >-
      Minutiae extraction and skeleton matching are more expensive than the ORB,
      Harris, and SIFT retrieval-vector paths; use small --limit smoke runs in tests
      and launch full benchmark runs manually.
  harris:
    api_name: harris
    benchmark_name: harris
    ui_label: Classic (Harris + ORB)
    family: local_features
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 512
      retrieval_vector_kind: harris_orb_aggregated_descriptor_v1
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: true
    canonical_default: true
    research_track: false
    promotion_required: false
    current_sources:
    - src/fpbench/matchers/matching_baseline.py
    - apps/api/service.py
    - pipelines/benchmark/evaluate.py
    - research_history/week02/week2_make_examples.py
    planned_location: src/fpbench/matchers/matching_baseline.py
    scoring:
      output_score: inliers_over_min_keypoints
      decision_threshold_ref: decision.api.harris
    api_runtime_defaults:
      detector: harris_orb
      nfeatures: 1500
      ratio: 0.75
      reproj_threshold: 3.0
      block_size: 2
      ksize: 3
      k: 0.04
      thresh_rel: 0.01
      max_points: 1200
      min_distance: 5.0
      orb_edge_threshold: 31
      orb_fast_threshold: 10
    benchmark_defaults:
      detector: harris_orb
      preprocess: runtime_square_512_clahe_blur
      mask_mode: none
      geometry_model: homography
      score_mode: inliers_over_min_keypoints
      nfeatures: 1500
      target_size: 512
      ratio: 0.75
      ransac_thresh: 3.0
      method_semantics_epoch: harris_runtime_aligned_v1
    notes:
    - Harris corners are computed in src/fpbench/matchers/matching_baseline.py and
      benchmark harris now reuses that runtime helper path with runtime square preprocessing,
      no ROI mask, homography RANSAC, and score normalization by the smaller detected keypoint count.
    - Descriptors remain ORB-based, so matching uses the same ORB-distance pipeline as the shipped runtime.
    - Canonical post-alignment benchmark rows carry method_semantics_epoch=harris_runtime_aligned_v1
      so older ROI/affine/fixed-k artifacts do not silently mix with current results.
  sift:
    api_name: sift
    benchmark_name: sift
    ui_label: Classic (SIFT)
    family: local_features
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 512
      retrieval_vector_kind: sift_aggregated_descriptor_v1
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: true
    canonical_default: true
    research_track: false
    promotion_required: false
    current_sources:
    - src/fpbench/matchers/matching_baseline.py
    - apps/api/service.py
    - pipelines/benchmark/evaluate.py
    planned_location: src/fpbench/matchers/matching_baseline.py
    scoring:
      output_score: inliers_over_min_keypoints
      decision_threshold_ref: decision.api.sift
    api_runtime_defaults:
      detector: sift
      nfeatures: 1500
      ratio: 0.75
      reproj_threshold: 3.0
      nOctaveLayers: 3
      contrastThreshold: 0.04
      edgeThreshold: 10
      sigma: 1.6
    benchmark_defaults:
      detector: sift
      preprocess: runtime_square_512_clahe_blur
      mask_mode: none
      geometry_model: homography
      score_mode: inliers_over_min_keypoints
      nfeatures: 1500
      target_size: 512
      ratio: 0.75
      ransac_thresh: 3.0
      method_semantics_epoch: sift_runtime_aligned_v1
    notes:
    - Benchmark sift now uses the same runtime square preprocessing, mask=None extraction path,
      homography RANSAC, and min-keypoint normalization as the shipped runtime method.
    - Canonical post-alignment benchmark rows carry method_semantics_epoch=sift_runtime_aligned_v1
      so older ROI/affine/fixed-k artifacts stay separated from current benchmark surfaces.
  sift_plain_roll_v2:
    api_name: sift_plain_roll_v2
    benchmark_name: sift_plain_roll_v2
    ui_label: SIFT Plain/Roll v2 (Experimental)
    family: local_features
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: false
      experimental: true
      retrieval_vector_dim: null
      retrieval_vector_kind: null
      retrieval_distance_metric: null
      retrieval_unavailable_reason: experimental_plain_roll_research_no_validated_global_retrieval_vector
      future_adapter_hint: A future retrieval adapter must be validated before this method is used for direct 1:N shortlist retrieval.
    status: experimental
    presentation_tier: research
    showcase_eligible: false
    benchmark_default: false
    canonical_default: false
    research_track: true
    promotion_required: true
    promotion_criteria:
    - Must be reproduced on the official NIST SD300B professor 1000 val/test protocol.
    - Must pass broader NIST SD300B/SD300C and cross-dataset validation before canonical promotion.
    - Must include reviewed visual audits of true accepts, false rejects, and false accepts at low FAR.
    showcase_exclusion_note: >-
      SIFT Plain/Roll v2 is an experimental research method optimized for NIST
      SD300B plain-vs-roll verification. It is excluded from canonical showcase
      ranking unless explicitly requested through a research profile or method list.
    current_sources:
    - src/fpbench/matchers/matching_baseline.py
    - apps/api/service.py
    - pipelines/benchmark/eval_classic.py
    - pipelines/benchmark/evaluate.py
    planned_location: src/fpbench/matchers/matching_baseline.py
    scoring:
      output_score: inliers_times_inlier_ratio_times_log1p_matches
      decision_threshold_ref: decision.api.sift_plain_roll_v2
    api_runtime_defaults:
      detector: sift
      target_size: 768
      nfeatures: 3000
      blur_ksize: 0
      ratio: 0.75
      ransac_model: affine_full_2d
      ransac_thresh: 3.0
      reproj_threshold: 3.0
      score_mode: inliers_times_inlier_ratio_times_log1p_matches
      nOctaveLayers: 3
      contrastThreshold: 0.04
      edgeThreshold: 10
      sigma: 1.6
    benchmark_defaults:
      detector: sift
      preprocess: runtime_square_768_clahe_no_blur
      mask_mode: none
      geometry_model: affine_full_2d
      score_mode: inliers_times_inlier_ratio_times_log1p_matches
      nfeatures: 3000
      target_size: 768
      blur_ksize: 0
      ratio: 0.75
      ransac_thresh: 3.0
      method_semantics_epoch: sift_plain_roll_v2_research_v1
    notes:
    - >-
      Experimental SIFT variant selected from focused plain-vs-roll diagnostics:
      target_size=768, nfeatures=3000, no Gaussian blur, Lowe ratio 0.75,
      affine_full_2d RANSAC at threshold 3.0, and score=inliers*(inliers/matches)*log1p(matches).
    - >-
      The method is optimized specifically for NIST SD300B plain-vs-roll verification.
      It does not replace the canonical `sift` method or its runtime/benchmark defaults.
    - >-
      The score is deterministic: when matches<=0 or inliers<=0 it is 0; otherwise
      inlier_ratio=inliers/max(matches,1) and score=inliers*inlier_ratio*log1p(matches).
  dl:
    api_name: dl
    benchmark_name: dl_quick
    ui_label: Deep Learning (ResNet18)
    family: global_embedding
    embedding_dim: 512
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 512
      retrieval_vector_kind: deep_embedding_resnet
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: true
    canonical_default: true
    research_track: false
    promotion_required: false
    current_sources:
    - src/fpbench/matchers/baseline_dl.py
    - apps/api/service.py
    - pipelines/benchmark/eval_quick.py
    - pipelines/benchmark/evaluate.py
    planned_location: src/fpbench/matchers/baseline_dl.py
    scoring:
      output_score: cosine_similarity
      decision_threshold_ref: decision.api.dl
    api_runtime_defaults:
      backbone: resnet18
      use_mask: true
      preprocess:
        target_size: 512
        clahe_clip: 2.0
        clahe_grid:
        - 8
        - 8
        blur_ksize: 3
      input_size: 224
      roi_min_frac: 0.02
      roi_max_frac: 0.85
      gate_top_plain: 0.18
      gate_top_roll: 0.05
      gate_border: 12
    benchmark_defaults:
      backbone: resnet18
      use_mask: true
      emb_cache_supported: true
    supported_backbones:
    - resnet18
    - resnet50
    - vit_base
    notes:
    - The API runtime instantiates BaselineDL with masking enabled by default, and
      canonical benchmark defaults now match that behavior.
    - Capture labels are normalized to plain, roll, contactless, or contact_based;
      masked runs map plain/contactless to the plain gate and roll/contact_based to
      the roll gate.
    - --no_mask remains available in benchmark CLI flows as an explicit ablation.
  vit:
    api_name: vit
    benchmark_name: vit
    ui_label: Deep Learning (ViT)
    family: global_embedding
    embedding_dim: 768
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: true
      retrieval_vector_dim: 768
      retrieval_vector_kind: vit_embedding
      retrieval_distance_metric: cosine
      retrieval_unavailable_reason: null
    status: active
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: true
    canonical_default: true
    research_track: false
    promotion_required: false
    current_sources:
    - src/fpbench/matchers/baseline_dl.py
    - apps/api/service.py
    - pipelines/benchmark/eval_quick.py
    - pipelines/benchmark/evaluate.py
    planned_location: src/fpbench/matchers/baseline_dl.py
    scoring:
      output_score: cosine_similarity
      decision_threshold_ref: decision.api.vit
    api_runtime_defaults:
      backbone: vit_base
      use_mask: true
      input_size: 224
    benchmark_defaults:
      backbone: vit_base
      use_mask: true
      emb_cache_supported: true
    notes:
    - ViT uses the same BaselineDL capture normalization and masking policy as dl,
      but with the vit_base backbone.
    - Canonical benchmark defaults now align with runtime masking behavior for vit.
    - --no_mask remains available in benchmark CLI flows as an explicit ablation.
  dedicated:
    api_name: dedicated
    benchmark_name: dedicated
    ui_label: Dedicated Patch AI (Experimental)
    family: learned_patch_matcher
    identification:
      supports_pairwise_rerank: true
      supports_direct_vector_retrieval: false
      experimental: true
      retrieval_vector_dim: null
      retrieval_vector_kind: null
      retrieval_distance_metric: null
      retrieval_unavailable_reason: experimental_rerank_only_no_validated_global_retrieval_vector_yet
      future_adapter_hint: A future dedicated_aggregated_patch_descriptor_v1 adapter can be added once global pooling is validated.
    status: experimental
    presentation_tier: research
    showcase_eligible: false
    benchmark_default: false
    canonical_default: false
    research_track: true
    promotion_required: true
    promotion_criteria:
    - Must beat or match canonical baselines on agreed benchmark bundles.
    - Must pass full NIST SD300b/SD300c and PolyU benchmark gates.
    - Must show stable AUC/EER/TAR@FAR and acceptable latency.
    - Must include reproducible run metadata and artifact validation.
    showcase_exclusion_note: >-
      Dedicated Patch AI remains available as an experimental research method,
      but the current checkpoint/results do not satisfy canonical benchmark
      showcase criteria and must not be promoted as a winner or champion.
    current_sources:
    - src/fpbench/matchers/dedicated_matcher.py
    - apps/api/service.py
    - pipelines/benchmark/eval_dedicated.py
    - pipelines/benchmark/evaluate.py
    - pipelines/benchmark/train_patch_descriptor.py
    planned_location: src/fpbench/matchers/dedicated_matcher.py
    scoring:
      output_score: geometry_aware_composite_score
      decision_threshold_ref: decision.api.dedicated
      components:
        mean_tentative_sim: 0.35
        mean_inlier_sim: 0.25
        inlier_ratio: 0.25
        stability_term: 0.15
        postprocess: clip_to_[0,1]
    api_runtime_defaults:
      patch: 48
      max_kpts: 800
      mask_cov_thr: 0.7
      max_matches: 200
      ransac_thresh: 4.0
      nn_delta: 0.0
      nn_sim_min: -1.0
    benchmark_defaults:
      patch: 48
      max_kpts: 800
      mask_cov_thr: 0.7
      max_matches: 200
      ransac_thresh: 4.0
      checkpoint_auto_path: artifacts/checkpoints/patch_descriptor/final/patch_descriptor_ckpt.pth
    notes:
    - The matcher accepts the canonical capture labels plain, roll, contactless, and
      contact_based after API normalization; capture drives masking/gating but is
      not restricted to plain/roll.
    - The dedicated score is a weighted blend of mean_tentative_sim (0.35), mean_inlier_sim
      (0.25), inlier_ratio (0.25), and stability_term (0.15), clipped to [0,1].
    - Overlay visualizations and detailed tentative/inlier similarity diagnostics
      are available for this method.
    - Dedicated Patch AI is tracked as experimental and excluded from the canonical
      h5 benchmark showcase because the current v2 checkpoint did not pass
      verification-level performance criteria.
    capture_support:
    - plain
    - roll
    - contactless
    - contact_based
  fusion_balanced_v1:
    api_name: fusion_balanced_v1
    benchmark_name: fusion_balanced_v1
    ui_label: Fingerprint Benchmark Fusion (SIFT + DL + ViT)
    family: score_fusion
    status: experimental
    presentation_tier: canonical
    showcase_eligible: true
    benchmark_default: false
    canonical_default: false
    research_track: false
    promotion_required: false
    current_sources:
      - pipelines/benchmark/evaluate.py
      - configs/methods.yaml
      - artifacts/reports/fusion/week11_candidate_balanced_v1/results_summary.csv
    planned_location: pipelines/benchmark/evaluate.py
    scoring:
      output_score: weighted_minmax_fusion
      notes:
        - Fits min-max normalization on the fit split only.
        - Applies fixed weighted fusion over normalized SIFT, DL Quick, and ViT scores.
    benchmark_defaults:
      source_methods:
        - sift
        - dl_quick
        - vit
      fit_split: val
      weights:
        sift: 0.91
        dl_quick: 0.05
        vit: 0.04
      source_score_filename_patterns:
        - scores_{method}_{split}.csv
        - scores_{dataset}_{method}_{split}.csv
    notes:
      - Benchmark-only method for score-level fusion.
      - Fingerprint algorithm-level score fusion, not cross-biometric fusion.
      - Not exposed in API runtime at this stage.
      - Intended to consume existing canonical score CSV artifacts and emit a canonical fused score CSV.
