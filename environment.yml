# Windows CPU profile. For exact builds use scripts/dev/bootstrap.ps1.
name: fingerprint_research_cpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.15
  - pip=26.2.1
  - openjdk=17.0.18
  - maven=3.9.16
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - -r requirements/windows-cpu.lock
